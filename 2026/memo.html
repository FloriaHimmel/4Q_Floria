<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MemoPad</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      margin: 0;
      padding: 40px 0;
      background-color: #f7f1e1; 
      color: #4a3f30;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
      color: #3b2f1f;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 0 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccbca1;
      border-radius: 8px;
      background-color: #fffef9;
      resize: none;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    button {
      font-size: 14px;
      padding: 6px 12px;
      margin-top: 10px;
      margin-right: 8px;
      background-color: #e3d5b8;
      color: #4a3f30;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #d4c3a3;
    }

    #memoList {
      margin-top: 20px;
      list-style: none;
      padding: 0;
    }

    li {
      background-color: #fffefb;
      border: 1px solid #dcd2b5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.05);
    }

    .memo-text {
      font-size: 16px;
      margin-bottom: 6px;
      white-space: pre-wrap;
    }

    .memo-text.done {
      color: #aaa;
      text-decoration: line-through;
    }

    .edit-area {
      margin-top: 6px;
    }

    .hidden {
      display: none;
    }

    .timestamp {
      font-size: 12px;
      color: #8b7d63;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <h1>☆MemoPad☆</h1>

  <div class="container">
    <textarea id="memoInput" placeholder="ここにメモを書いてください。"></textarea><br>
    <button onclick="addMemo()">追加</button>

    <ul id="memoList"></ul>
  </div>

  <script>
    let memos = JSON.parse(localStorage.getItem('memos')) || [];

    function saveMemos() {
      localStorage.setItem('memos', JSON.stringify(memos));
    }

    function getCurrentTime() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${d} ${h}:${min}`;
    }

    function renderMemos() {
      const list = document.getElementById('memoList');
      list.innerHTML = '';
      memos.forEach((memo, index) => {
        const li = document.createElement('li');

        const time = document.createElement('div');
        time.className = 'timestamp';
        time.textContent = memo.time;

        const memoDiv = document.createElement('div');
        memoDiv.className = 'memo-text' + (memo.done ? ' done' : '');
        memoDiv.textContent = memo.text;

        const editInput = document.createElement('textarea');
        editInput.className = 'edit-area hidden';
        editInput.value = memo.text;

        const buttonArea = document.createElement('div');
        buttonArea.className = 'button-area';

        const editBtn = document.createElement('button');
        editBtn.textContent = '編集';
        editBtn.onclick = () => {
          memoDiv.classList.add('hidden');
          editInput.classList.remove('hidden');
          editInput.focus();
        };

        const saveBtn = document.createElement('button');
        saveBtn.textContent = '保存';
        saveBtn.onclick = () => {
          const newText = editInput.value.trim();
          if (newText !== '') {
            memos[index].text = newText;
            saveMemos();
            renderMemos();
          }
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '削除';
        deleteBtn.onclick = () => {
          memos.splice(index, 1);
          saveMemos();
          renderMemos();
        };

        const doneBtn = document.createElement('button');
        doneBtn.textContent = memo.done ? '未完了に戻す' : '完了';
        doneBtn.onclick = () => {
          memos[index].done = !memos[index].done;
          saveMemos();
          renderMemos();
        };

        buttonArea.appendChild(editBtn);
        buttonArea.appendChild(saveBtn);
        buttonArea.appendChild(deleteBtn);
        buttonArea.appendChild(doneBtn);

        li.appendChild(time);
        li.appendChild(memoDiv);
        li.appendChild(editInput);
        li.appendChild(buttonArea);
        list.appendChild(li);
      });
    }

    function addMemo() {
      const input = document.getElementById('memoInput');
      const text = input.value.trim();
      if (text !== '') {
        memos.push({
          text: text,
          done: false,
          time: getCurrentTime()
        });
        saveMemos();
        renderMemos();
        input.value = '';
      }
    }

    renderMemos();
  </script>
</body>
</html>
