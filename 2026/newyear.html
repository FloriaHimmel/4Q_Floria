<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2026 - Floria</title>
    <style>
        body {
            background-color: #8b0000; /* 深红 */
            background-image: radial-gradient(#a52a2a 15%, transparent 16%),
            radial-gradient(#a52a2a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: "Yu Mincho", "SimSun", "Hiragino Mincho ProN", serif;
            color: #FFD700; /* 金色 */
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .card {
            background: rgba(178, 34, 34, 0.95); /* 半透明火砖红 */
            border: 4px solid #FFD700;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        /* 装饰角花 */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #FFD700;
            opacity: 0.8;
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 5px;
            font-family: "Songti SC", serif;
            margin-bottom: 10px;
        }
        
        .sub-title {
            font-size: 1.2em;
            margin-bottom: 20px;
            border-bottom: 1px solid #FFD700;
            display: inline-block;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }

        /* 语言选择器样式 */
        .lang-select-container {
            margin-bottom: 20px;
        }
        select {
            padding: 5px 15px;
            font-size: 14px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            background: #fff;
            color: #8b0000;
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }

        /* 动态文案区域 */
        .greeting {
            font-size: 1.1em;
            line-height: 1.8em;
            margin-bottom: 40px;
            color: #fff;
            white-space: pre-wrap; /* 保留换行符 */
            text-align: left; /* 长文案左对齐更好阅读 */
            padding: 0 10px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .nav-btn {
            background: #FFD700;
            color: #8b0000;
            text-decoration: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 #b8860b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            background: #fff;
        }
        
        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .nav-icon {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        footer {
            margin-top: 50px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8em;
            position: relative;
            z-index: 10;
        }

        /* 烟花画布 */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <h1>恭賀新禧</h1>
        <div class="sub-title">Happy New Year 2026</div>

        <div class="lang-select-container">
            <select id="langSelect">
                <option value="zh">🇨🇳 中文</option>
                <option value="jp" selected>🇯🇵 日本語</option>
                <option value="kr">🇰🇷 한국어</option>
            </select>
        </div>

        <div id="messageBox" class="greeting">
            </div>

        <div class="nav-grid">
            <a href="watersort.html" class="nav-btn">
                <span class="nav-icon">🧪</span>
                <span>ソート</span>
            </a>
            <a href="omikuji.html" class="nav-btn">
                <span class="nav-icon">⛩️</span>
                <span>おみくじ</span>
            </a>
            <a href="memo.html" class="nav-btn">
                <span class="nav-icon">📝</span>
                <span>記念ノート</span>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Floria's New Year Site.
    </footer>

    <script>
        const MESSAGES = {
            zh: `🏮大家新年快乐，我是芙洛莉雅！！🧨
去年承蒙大家照顾，衷心感谢各位。
2026年是丙午马年，也是我的本命年🐎✨。
希望今年我身边的人，以及看到这里的各位都能身体健康，万事顺遂。
今年也请多多关照！🧧✨`,

            jp: `皆さん、明けましておめでとうございます！🎍🌅 フロリアです！
昨年は大変お世話になりました。皆様に心より感謝申し上げます。

2026年は中国の干支で「丙午（びんう）年」にあたり、私も午（うま）年生まれです🐎✨。
今年一年、身近な皆様、そしてこれをご覧の皆様が健康で💪、全ての物事が順調に進むことを願っております🌸。

本年もどうぞよろしくお願いいたします！🎎🍶`,

            kr: `새해 복 많이 받으세요! 🙇‍♀️☀️ 플로리아입니다!
지난 한 해 동안 여러분께 많은 보살핌을 받았습니다.
이 자리를 빌려 모든 분께 진심으로 감사의 말씀을 드립니다.

2026년은 중국의 병오년이고, 저도 말띠입니다🐎.
올 한 해 제 주변의 모든 분들과 이 글을 보고 계신 여러분 모두 건강하시고💪, 하시는 모든 일이 잘 풀리기를 바랍니다🪁.

새해에도 잘 부탁드립니다!✨`
        };

        const langSelect = document.getElementById('langSelect');
        const messageBox = document.getElementById('messageBox');

        function setLanguage(lang) {
            messageBox.style.opacity = 0;
            setTimeout(() => {
                messageBox.innerText = MESSAGES[lang];
                messageBox.style.opacity = 1;
            }, 150);
        }

        langSelect.addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        // 初始化：默认日文
        window.onload = () => {
            setLanguage('jp');
            startFireworks();
        };

        /* ================= 烟花特效 ================= */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        // 配色：金色、白色、亮橙、亮黄 (适配红色背景)
        const FIREWORK_COLORS = ['#FFD700', '#FFFFFF', '#FF8C00', '#FFFF00', '#FF4500'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle(x, y) {
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity,
                    color: FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.005,
                    gravity: 0.05
                });
            }
        }

        function loopFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            
            if (Math.random() < 0.05) { 
                createParticle(
                    Math.random() * canvas.width, 
                    Math.random() * canvas.height * 0.7 
                );
            }

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(loopFireworks);
        }

        function startFireworks() {
            createParticle(canvas.width * 0.2, canvas.height * 0.3);
            createParticle(canvas.width * 0.8, canvas.height * 0.4);
            loopFireworks();
        }
    </script>

</body>
</html>
