<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>猫カフェ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --accent: rgba(80, 180, 180, 0.65);
      --accent-light: rgba(80, 180, 180, 0.15);
      --text-main: #1f2933;
      --text-sub: #4b5563;
      --bg-main: #f7faf9;
      --card-bg: rgba(255, 255, 255, 0.75);
      --border-soft: rgba(80, 180, 180, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(
        135deg,
        rgba(200, 230, 230, 0.35),
        rgba(220, 245, 240, 0.35)
      );
      color: var(--text-main);
      line-height: 1.7;
    }

    .container {
      max-width: 860px;
      margin: 80px auto;
      padding: 48px 56px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.5em;
      letter-spacing: 0.05em;
    }

    /* === 图片切换核心样式 === */
    .profile-image {
      position: relative;
      width: 260px; /* 必须限制宽度 */
      height: auto;
      margin: 0 auto 32px; /* 居中 */
      cursor: pointer;
    }

    .profile-image img {
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      transition: opacity 0.4s ease; /* 平滑过渡效果 */
    }

    /* 默认显示的图 (第一张) */
    .img-front {
      position: relative;
      z-index: 2;
      opacity: 1;
    }

    /* 悬停时显示的图 (第二张) */
    .img-back {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      opacity: 0; /* 默认隐藏 */
    }

    /* 悬停时的逻辑：第一张变透明，露出第二张 */
    .profile-image:hover .img-front {
      opacity: 0;
    }
    .profile-image:hover .img-back {
      opacity: 1;
    }
    /* ========================== */

    h2 {
      margin-top: 2.5em;
      margin-bottom: 0.6em;
      font-size: 1.4rem;
      color: var(--accent);
      position: relative;
    }

    h2::after {
      content: "";
      display: block;
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin-top: 6px;
      border-radius: 2px;
      opacity: 0.6;
    }

    p {
      color: var(--text-sub);
      margin: 0.6em 0;
    }

    ul {
      padding-left: 1.2em;
      margin-top: 0.8em;
    }

    li {
      margin: 0.4em 0;
      color: var(--text-sub);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    a:hover {
      border-bottom: 1px solid var(--accent);
      opacity: 0.85;
    }

    .note {
      font-size: 0.9em;
      color: #7d8a96;
      margin-left: 8px;
    }

    .footer {
      margin-top: 3em;
      font-size: 0.85rem;
      color: rgba(75, 85, 99, 0.7);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>猫カフェ</h1>
    
    <div class="profile-image">
      <img src="images/miqote_idol.png" alt="Normal Face" class="img-front">
      <img src="images/miqote_idol_wink.png" alt="Wink Face" class="img-back">
    </div>

    <h2>About Me</h2>
    <p>
      はじめにゃして！<br />
      猫の惑星からやってきた、猫耳アイドルの<b>フロリア</b>です！
    </p>
    <p>
      歌とダンスで、みんなに笑顔と幸せを届けるために頑張っていますにゃ！<br />
      応援よろしくね！
    </p>

    <h2>リンク</h2>
    <ul>
      <li>

          本体から届いた年賀状
        </a>
      </li>
      <li>

          X (Twitter)
        </a>
      </li>
      <li>
        <a href="https://github.com/FloriaHimmel" target="_blank">
          GitHub
        </a>
      </li>
    </ul>

    <h2>使用したもの</h2>

      <li>Markdown</li>

    </ul>

    <div class="footer">
      © Floria Himmel
    </div>
  </main>
</body>
</html>
