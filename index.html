<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>猫カフェ</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: linear-gradient(180deg, #eef7f8, #ffffff);
      color: #333;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 150, 160, 0.08);
    }

    h1 {
      text-align: center;
      color: #4aa6a6;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    .profile-image {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }

    .profile-image img {
      width: 260px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    h2 {
      color: #5fbcbc;
      border-left: 4px solid rgba(95, 188, 188, 0.6);
      padding-left: 12px;
      margin-top: 40px;
    }

    p {
      line-height: 1.8;
      margin-top: 16px;
    }

    ul {
      margin-top: 16px;
      padding-left: 20px;
    }

    a {
      color: #4aa6a6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>猫カフェ</h1>

    <div class="profile-image">
      <img src="images/miqote_idol.png" alt="profile image">

    <h2>はじめまして</h2>
    <p>

      フロリアです！<br>

    </p>

    <h2>このページについて...？</h2>
    <p>
      Markdownはとても使いやすいと思います！！！好きにニャリました！
    </p>

    <h2>使用したもの</h2>
    <ul>
      <li>Markdown</li>
      <li>GitHub Pages</li>
      <li>HTML</li>
    </ul>

    <h2>リンク</h2>
    <ul>
      <a href="https://space.bilibili.com/8447233" target="_blank">
          Bilibili
        </a>
      </li>
      <li>
        <a href="https://github.com/FloriaHimmel" target="_blank">
          GitHub
        </a>
      </li>
    </ul>

    <div class="footer">
      © Floria Himmel
    </div>

</html>
